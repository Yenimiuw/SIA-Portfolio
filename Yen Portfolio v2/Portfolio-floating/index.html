<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Browser tab title + search-engine description. Edit these two directly. -->
  <title>Portfolio Mockup 3 | Project Manager</title>
  <meta name="description" content="Portfolio of a project manager.">
  <!-- Favicon (tab icon): drop an image in Assets/ and uncomment the line below.
  <link rel="icon" href="Assets/favicon.png">
  -->

  <!-- Fonts. If you change these, also update --head / --body in style.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <!-- FLOATING: floating panels + meadow background (remove to restore the original look) -->
  <link rel="stylesheet" href="floating.css">

  <!-- Marks the page as "JS is on" before anything paints (keeps content
       visible for visitors without JavaScript). Leave this as is. -->
  <script>document.documentElement.classList.add('js')</script>
  <noscript><style>#loader{display:none}</style></noscript>
</head>

<body>
  <!-- FLOATING: background underneath everything -->
  <div id="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i></div>
  <!--
    HOW THIS FILE WORKS
    Text is NOT typed in here. Elements marked with data-text / data-href / data-lines
    are filled in by inter.js from the CONFIG block at the top of that file.
      data-text="about.heading"  → fills this element with CONFIG.about.heading
    Lists (roles, skills, projects…) are built into the empty containers by inter.js.
    To change content, edit CONFIG in inter.js. See GUIDE.md.
  -->

  <!-- Scroll progress bar (top of screen) -->
  <div id="progress-bar"></div>

  <!-- Intro loader -->
  <div id="loader" role="status" aria-live="polite">
    <div class="dot"></div>
    <b><span id="count">0</span>%</b>
    <small data-text="loader.text"></small>
  </div>


  <!-- ======================= NAVIGATION ======================= -->
  <nav aria-label="Main">
    <a class="logo" href="#top" data-text="site.name"></a>
    <ul id="nav-links"></ul>
    <button class="btn" data-open>
      <span data-text="nav.buttonLabel"></span>
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i>
    </button>
  </nav>


  <!-- ======================= HERO ======================= -->
  <!-- style="--i:N" sets the order items fade in (0 = first) -->
  <header class="hero" id="top">
    <div class="wrap">

      <div class="hero-stage">
        <div>
          <p class="hero-greeting hero-in" style="--i:0" data-text="hero.greeting"></p>
          <h1 class="hero-in" style="--i:1" data-lines="hero.title"></h1>
        </div>

        <div class="hero-philosophy hero-in" style="--i:2">
          <b data-text="hero.philosophy.heading"></b>
          <p data-text="hero.philosophy.text"></p>
          <a class="btn solid" data-href="hero.philosophy.buttonLink">
            <span data-text="hero.philosophy.buttonLabel"></span>
            <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></i>
          </a>
        </div>

        <!-- Your photo: filled from CONFIG.hero.photo -->
        <div class="hero-photo hero-in" style="--i:1" id="hero-photo"></div>
      </div>

      <!-- Role chips: built from CONFIG.hero.roles -->
      <ul class="roles hero-in" style="--i:3" aria-label="Roles" id="hero-roles"></ul>

      <!-- Organization logos: built from CONFIG.hero.organizations -->
      <div class="orgs hero-in" style="--i:4" id="hero-orgs"></div>

    </div>
    <div class="hero-dim"></div>
  </header>


  <!-- ======================= ABOUT ======================= -->
  <section id="about">
    <div class="wrap about">
      <div class="reveal">
        <h2 data-text="about.heading"></h2>
        <p data-text="about.text"></p>
        <ul class="stats" id="about-stats"></ul>
      </div>
      <div class="skeleton about-photo reveal" id="about-photo"></div>
    </div>
  </section>


  <!-- ======================= SKILLS ======================= -->
  <section id="skills" class="sheet dark">
    <div class="wrap">
      <h2 class="reveal" data-text="skills.heading"></h2>
    </div>
    <!-- Scrolling rows: built from CONFIG.skills.groups -->
    <div id="skills-groups"></div>
  </section>


  <!-- ======================= FEATURED PROJECT ======================= -->
  <section id="projects" class="sheet">
    <div class="wrap">
      <h2 class="reveal" data-text="featured.heading"></h2>
      <article class="featured reveal">
        <!-- data-s = how much the screenshot shrinks while scrolling (0 = none) -->
        <div class="skeleton featured-shot" data-s=".16" id="featured-image"></div>
        <div>
          <span class="pill tag" data-text="featured.category"></span>
          <h3 data-text="featured.title"></h3>
          <p data-text="featured.description"></p>
          <a class="btn" data-href="featured.button.url">
            <span data-text="featured.button.label"></span>
            <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i>
          </a>
        </div>
      </article>
    </div>
  </section>


  <!-- ======================= MORE PROJECTS ======================= -->
  <section id="more" class="sheet dark">
    <div class="wrap">
      <h2 class="reveal" data-text="more.heading"></h2>

      <div class="carousel" id="carousel" role="region" aria-roledescription="carousel" aria-label="More projects" tabindex="0">
        <!-- Cards: built from CONFIG.more.projects -->
        <div id="cards"></div>
        <div class="carousel-controls">
          <button class="carousel-btn" id="prev" aria-label="Previous project">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="dots" id="dots"></div>
          <button class="carousel-btn" id="next" aria-label="Next project">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <div class="more-cta">
        <a class="btn ghost" data-href="more.viewMore.url" data-text="more.viewMore.label"></a>
      </div>
    </div>
  </section>


  <!-- ======================= FOOTER ======================= -->
  <footer class="sheet dark">
    <div class="wrap">
      <div class="footer-grid">
        <div>
          <b data-text="site.name"></b>
          <p data-text="footer.blurb"></p>
          <button class="talk-link" data-open data-text="footer.talkLabel"></button>
        </div>
        <ul aria-label="Footer" id="footer-links"></ul>
        <!-- Social icons, phone number and GitHub: built from CONFIG.footer -->
        <div class="socials" id="socials"></div>
      </div>
      <div class="footer-copy">
        <span data-text="footer.copyright"></span>
        <span data-text="footer.note"></span>
      </div>
    </div>
  </footer>


  <!-- ======================= CONTACT POP-UP ======================= -->
  <dialog id="contact">
    <h2 data-text="contact.heading"></h2>
    <p data-text="contact.intro"></p>
    <form id="contact-form">
      <label for="n">Name</label>
      <input id="n" name="name" required autocomplete="name">

      <label for="e">Email</label>
      <input id="e" name="email" type="email" required autocomplete="email">

      <label for="m">Message</label>
      <textarea id="m" name="message" required></textarea>

      <div class="form-actions">
        <button class="btn solid" data-text="contact.submitLabel"></button>
        <button type="button" class="cancel-btn" id="close-contact" data-text="contact.cancelLabel"></button>
      </div>
      <p id="form-status" role="status"></p>
    </form>
  </dialog>


  <script src="inter.js"></script>
  <!-- FLOATING: cross-fade the two meadow photos as you scroll -->
  <script>
    (function () {
      var b2 = document.querySelector('#bg .b2');
      function upd() {
        var max = document.documentElement.scrollHeight - innerHeight;
        var t = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
        b2.style.opacity = Math.min(1, Math.max(0, (t - .15) / .5));
      }
      addEventListener('scroll', upd, { passive: true }); addEventListener('resize', upd); upd();
    })();
  </script>
</body>
</html>
